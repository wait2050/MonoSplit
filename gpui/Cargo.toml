[package]
name = "monosplit-gpui"
version = "0.5.0"
edition = "2024"
license = "0BSD"
description = "Independent macOS mono crossover and EQ, with an optional FineTune output bridge"
repository = "https://github.com/wait2050/MonoSplit"

[dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"

[profile.dev]
debug = 0

[profile.release]
opt-level = 2
strip = "debuginfo"
